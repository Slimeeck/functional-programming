[project]
name = "lab05-lazy-geometric"
version = "1.0.0"
description = "ЛР5, варіант 4: геометрична прогресія (лінивi обчислення)"
requires-python = ">=3.10"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
